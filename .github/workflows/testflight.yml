# Builds, signs and uploads Peepz to TestFlight from a cloud Mac. Run it by hand from the Actions tab.
#
# Needs a paid Apple Developer account and these repository secrets (Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID   10-character Team ID from developer.apple.com > Account > Membership
#   ASC_KEY_ID      App Store Connect API key ID          (App Store Connect > Users and Access > Integrations)
#   ASC_ISSUER_ID   Issuer ID shown on that same page
#   ASC_KEY_P8      The full text of the downloaded AuthKey_XXXX.p8 file (key needs the Admin role)
# Also create the app once in App Store Connect with bundle ID com.ultimatedrt.peepz (or whatever project.yml says).
name: TestFlight

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Archive unsigned: an automatically signed archive needs a development profile, which
      # needs a registered iPhone. The export step below signs for the App Store instead,
      # using Apple's cloud-managed distribution certificate.
      - name: Archive
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild -project Peepz.xcodeproj -scheme Peepz -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Peepz.xcarchive \
            DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | grep -E "error:|warning:|ARCHIVE" || true
          test -d build/Peepz.xcarchive

      - name: Upload to TestFlight
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Peepz.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
