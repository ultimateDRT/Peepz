# Peepz iOS project definition.
# The .xcodeproj is generated from this file with XcodeGen (https://github.com/yonaskolb/XcodeGen),
# so nobody has to edit an Xcode project by hand, and the cloud Mac builds can recreate it.
#   brew install xcodegen && xcodegen generate
name: Peepz
options:
  bundleIdPrefix: com.peepz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Peepz:
    type: application
    platform: iOS
    sources:
      - path: Peepz
    settings:
      base:
        # GUESS: bundle ID must be unique on the App Store. Change it before the first TestFlight upload if taken.
        PRODUCT_BUNDLE_IDENTIFIER: com.peepz.app
        PRODUCT_NAME: Peepz
        INFOPLIST_FILE: Peepz/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Peepz:
    build:
      targets:
        Peepz: all
    run:
      config: Debug
    archive:
      config: Release
